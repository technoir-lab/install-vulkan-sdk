name: 'Install Vulkan SDK'
description: 'Automatically downloads and installs prebuilt Vulkan SDK releases.'
branding:
  icon: 'play'
  color: 'red'
inputs:
  version:
    description: 'official Vulkan SDK release version to use'
    default: 'latest'
    required: true
  cache:
    description: 'whether to cache the downloaded vulkan_sdk.* installer file (using github actions/cache)'
    default: false
    required: false
  quiet:
    description: 'silence GitHub Annotation notice displayed if resolving `latest` into Vulkan SDK release number'
    default: false
    required: false
  components:
    description: 'space separated list of Vulkan SDK component ids to install (default: com.lunarg.vulkan.core); available: com.lunarg.vulkan.core, com.lunarg.vulkan.usr, com.lunarg.vulkan.sdl2, com.lunarg.vulkan.glm, com.lunarg.vulkan.volk, com.lunarg.vulkan.vma, com.lunarg.vulkan.ios, com.lunarg.vulkan.kosmic, com.lunarg.vulkan.debug, com.lunarg.vulkan.x64, com.lunarg.vulkan.arm64'
    default: 'com.lunarg.vulkan.core'
    required: false
runs:
  using: "composite"
  steps:
    - name: Preset environment variables
      id: preset-env
      shell: bash
      run: |
        # preset env
        basedir=$PWD
        runner_os=${RUNNER_OS:-`uname -s`}
        runner_arch=${RUNNER_ARCH:-`uname -m`}
        case $runner_os in
          macOS|Darwin) os=mac ;;
          Linux) os=linux ;;
          Windows|MINGW*)
            case $runner_arch in
              X64|x86_64) os=windows ;;
              ARM64|aarch64) os=warm ;;
              *) echo "unknown runner_arch: $runner_arch" ; exit 7 ; ;;
            esac ; basedir=$(pwd -W) ;;
          *) echo "unknown runner_os: $runner_os" ; exit 7 ; ;;
        esac
        version=${VULKAN_SDK_VERSION:-${{ inputs.version }}}
        sdk_dir=${VULKAN_SDK_DIR:-$basedir/VULKAN_SDK}
        test -d $sdk_dir || mkdir -pv $sdk_dir
        if [[ $version == 'latest' ]] ; then
          url=https://vulkan.lunarg.com/sdk/latest/$os.txt
          echo "note: resolving '$version' for '$os' via webservices lookup: $url" >&2
          version=$(curl -sL $url)
          test -n "$version" || { echo "could not resolve latest version" ; exit 9 ; }
          [[ "${{ inputs.quiet }}" == "true" ]] || echo "::notice title=Using Vulkan SDK $version::resolved via '$url'"
        fi
        components=$(echo ${VULKAN_SDK_COMPONENTS:-${{ inputs.components }}} | tr ',' ' ' | tr '[:upper:]' '[:lower:]')
        . $GITHUB_ACTION_PATH/vulkan_prebuilt_helpers.sh
        components=$(_vulkan_effective_components $os $components) || exit $?
        echo "sdk_dir=$sdk_dir" >> $GITHUB_OUTPUT
        echo "cache_components=$(echo $components | tr ' ,' '-')" >> $GITHUB_OUTPUT
        (
          echo VULKAN_SDK_VERSION=$version
          echo VULKAN_SDK_PLATFORM=$os
        ) | tee -a $GITHUB_ENV
        echo "components=${components// /,}" >> $GITHUB_OUTPUT

    - name: Check Vulkan SDK installer cache
      id: vulkan-cached-sdk
      if: inputs.cache != 'false'
      uses: actions/cache@v6.1.0
      with:
        path: vulkan_sdk.*
        key: ${{ runner.os }}-${{ runner.arch }}-vulkan-prebuilt-sdk-${{ inputs.cache }}-${{ env.VULKAN_SDK_VERSION }}-${{ steps.preset-env.outputs.cache_components }}

    - name: Download Vulkan SDK
      shell: bash
      run: |
        # download
        . $GITHUB_ACTION_PATH/vulkan_prebuilt_helpers.sh
        download_vulkan_installer ${VULKAN_SDK_PLATFORM}

    - name: Install Vulkan SDK
      shell: bash
      env:
        VULKAN_SDK_COMPONENTS: ${{ steps.preset-env.outputs.components }}
        VULKAN_SDK_DIR: ${{ steps.preset-env.outputs.sdk_dir }}
      run: |
        # install
        . $GITHUB_ACTION_PATH/vulkan_prebuilt_helpers.sh
        unpack_vulkan_installer ${VULKAN_SDK_PLATFORM}
        # macOS and Linux SDKs ship a setup-env.sh; source it and export the
        # resulting environment so later job steps see the same setup a local
        # developer gets from `source setup-env.sh`. Windows has no
        # setup-env.sh, so set the equivalent variables directly.
        if [[ ${VULKAN_SDK_PLATFORM} == windows || ${VULKAN_SDK_PLATFORM} == warm ]] ; then
          vulkan_sdk=${VULKAN_SDK_DIR}
          echo VULKAN_SDK=${vulkan_sdk} | tee -a $GITHUB_ENV
        else
          if [[ ${VULKAN_SDK_PLATFORM} == mac ]] ; then
            setup_env=${VULKAN_SDK_DIR}/setup-env.sh
          else
            setup_env=${VULKAN_SDK_DIR}/${VULKAN_SDK_VERSION}/setup-env.sh
          fi
          test -f "$setup_env"
          . "$setup_env"
          vulkan_sdk=${VULKAN_SDK}
          echo VULKAN_SDK=${vulkan_sdk} | tee -a $GITHUB_ENV
          echo VK_ADD_LAYER_PATH=${VK_ADD_LAYER_PATH} | tee -a $GITHUB_ENV
          echo PKG_CONFIG_PATH=${PKG_CONFIG_PATH} | tee -a $GITHUB_ENV
          if [[ ${VULKAN_SDK_PLATFORM} == mac ]] ; then
            echo DYLD_LIBRARY_PATH=${DYLD_LIBRARY_PATH} | tee -a $GITHUB_ENV
            echo VK_ICD_FILENAMES=${VK_ICD_FILENAMES} | tee -a $GITHUB_ENV
            echo VK_DRIVER_FILES=${VK_DRIVER_FILES} | tee -a $GITHUB_ENV
          else
            echo LD_LIBRARY_PATH=${LD_LIBRARY_PATH} | tee -a $GITHUB_ENV
            echo CMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH} | tee -a $GITHUB_ENV
          fi
        fi
        # C_INCLUDE_PATH/LIBRARY_PATH are not set by setup-env.sh, so export
        # them on every platform so C/C++ compilers and linkers find the SDK's
        # headers and libraries without extra -I/-L flags; any existing values
        # are preserved (the SDK directories are prepended). The Windows SDK
        # uses capitalized Include/ and Lib/ directories.
        if [[ ${VULKAN_SDK_PLATFORM} == windows || ${VULKAN_SDK_PLATFORM} == warm ]] ; then
          sdk_include=${vulkan_sdk}/Include
          sdk_lib=${vulkan_sdk}/Lib
          path_sep=';'
        else
          sdk_include=${vulkan_sdk}/include
          sdk_lib=${vulkan_sdk}/lib
          path_sep=':'
        fi
        echo C_INCLUDE_PATH=${sdk_include}${C_INCLUDE_PATH:+$path_sep$C_INCLUDE_PATH} | tee -a $GITHUB_ENV
        echo LIBRARY_PATH=${sdk_lib}${LIBRARY_PATH:+$path_sep$LIBRARY_PATH} | tee -a $GITHUB_ENV

    - name: Cleanup Vulkan SDK download file
      if: inputs.cache == 'false'
      shell: bash
      run: |
        # cleanup
        rm -v vulkan_sdk.* || true

    - name: Verify Vulkan SDK binary
      shell: bash
      run: |
        $VULKAN_SDK/bin/glslangValidator --version

    - name: Export bin/ PATH to environment
      shell: bash
      run: |
        echo ${VULKAN_SDK}/bin | tee -a $GITHUB_PATH
        du -hs ${VULKAN_SDK}
