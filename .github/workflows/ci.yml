name: test install-vulkan-sdk
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      extra_tests:
        description: 'Enable additional CI tests'
        required: false
        default: 'false'
      versions:
        description: 'Vulkan SDK Versions'
        required: true
        default: '[ "1.4.357.0" ]'
      oses:
        description: 'Matrix OSes'
        required: true
        default: '[ "ubuntu-26.04", "windows-2025", "macos-26", "windows-11-arm" ]'
      quiet:
        description: 'silence annotation'
        required: false
        default: 'false'

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  setup-all-matrix:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || github.event.inputs.extra_tests == 'true' || github.event.inputs.extra_tests == 'matrix' }}
    strategy:
      matrix:
        os: ${{ fromJSON(github.event.inputs.oses || '[ "ubuntu-26.04", "windows-2025", "macos-26", "windows-11-arm" ]') }}
        version: ${{ fromJSON(github.event.inputs.versions || '[ "1.4.357.0" ]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./
        with:
          version: ${{ matrix.version }}
          cache: true
          quiet: ${{ github.event.inputs.quiet }}
      - name: Test Vulkan SDK Install
        shell: bash
        run: |
          echo "Vulkan SDK Version=='$VULKAN_SDK_VERSION'"
          echo "VULKAN_SDK=='$VULKAN_SDK'"
          test -n "$VULKAN_SDK_VERSION"
          glslangValidator --version
          cmake -B tests/build -S tests -DCMAKE_BUILD_TYPE=Release -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=.
          cmake --build tests/build --config release

  setup-components-cache:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || github.event.inputs.extra_tests == 'true' || github.event.inputs.extra_tests == 'matrix' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./
        with:
          version: 1.4.357.0
          cache: true
          components: com.lunarg.vulkan.core com.lunarg.vulkan.volk
      - name: Test Vulkan SDK Install
        shell: bash
        run: |
          echo "Vulkan SDK Version=='$VULKAN_SDK_VERSION'"
          echo "VULKAN_SDK=='$VULKAN_SDK'"
          test -n "$VULKAN_SDK_VERSION"
          glslangValidator --version

  test-prebuilt-windows:
    if: ${{ contains(github.event.inputs.extra_tests, 'prebuilt-windows') }}
    strategy:
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./
        id: composite
        with:
          version: ${{ fromJSON(github.event.inputs.versions)[0] }}
          cache: false
      - name: Smoke test Vulkan SDK
        shell: bash
        run: |
          echo VULKAN_SDK=$VULKAN_SDK
          echo VULKAN_SDK_VERSION=$VULKAN_SDK_VERSION
          echo C_INCLUDE_PATH=$C_INCLUDE_PATH
          echo LIBRARY_PATH=$LIBRARY_PATH
          test -n "$C_INCLUDE_PATH"
          test -n "$LIBRARY_PATH"
          glslangValidator --version
          spirv-cfg --version
          spirv-cross --help 2>&1 | head -1
          glslc --version
          du -hsc $VULKAN_SDK/*
          find $VULKAN_SDK -size +50M | xargs ls -lrth
      - name: Test compiling against Vulkan SDK
        shell: cmd
        run: |
          echo "Vulkan SDK Version=='%VULKAN_SDK_VERSION%'"
          echo "VULKAN_SDK=='%VULKAN_SDK%'"
          if "%VULKAN_SDK_VERSION%"=="" exit 1
          cmake -B tests/build -S tests -DCMAKE_BUILD_TYPE=Release -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=. || exit /b 2
          cmake --build tests/build --config release || exit /b 3
          dir .\tests\build\test_vulkan.exe
          echo testing...
          set PATH=%PATH%;%VULKAN_SDK%/Bin
          .\tests\build\test_vulkan || echo COMPILE TEST ONLY COULD NOT RUN || exit /b 4
      - name: Setup tmate session on failure
        if: failure()
        uses: mxschmitt/action-tmate@v3.24
        with:
          limit-access-to-actor: true


  test-prebuilt-linux:
    if: ${{ contains(github.event.inputs.extra_tests, 'prebuilt-linux') }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./
        with:
          version: ${{ fromJSON(github.event.inputs.versions)[0] }}
          cache: false
      - name: Smoke test Vulkan SDK
        shell: bash
        run: |
          echo VULKAN_SDK=$VULKAN_SDK
          echo VULKAN_SDK_VERSION=$VULKAN_SDK_VERSION
          echo C_INCLUDE_PATH=$C_INCLUDE_PATH
          echo LIBRARY_PATH=$LIBRARY_PATH
          echo LD_LIBRARY_PATH=$LD_LIBRARY_PATH
          test -n "$C_INCLUDE_PATH"
          test -n "$LIBRARY_PATH"
          test -n "$LD_LIBRARY_PATH"
          glslangValidator --version
          spirv-cfg --version
          spirv-cross --help 2>&1 | head -1
          glslc --version
          du -hsc $VULKAN_SDK/*
          find $VULKAN_SDK -size +50M | xargs ls -lrth
      - name: Test compiling against Vulkan SDK Install
        shell: bash
        run: |
          echo "Vulkan SDK Version=='$VULKAN_SDK_VERSION'"
          echo "VULKAN_SDK=='$VULKAN_SDK'"
          glslangValidator --version
          test -n "$VULKAN_SDK_VERSION"
          # C_INCLUDE_PATH/LIBRARY_PATH and the platform runtime library path
          # are exported by the action; compile/link/run with a bare `cc` and
          # no extra env vars to verify the SDK is found
          mkdir -p tests/build
          cc -o tests/build/test_vulkan_env tests/test_vulkan.c -lvulkan
          ./tests/build/test_vulkan_env
          cmake -B tests/build -S tests -DCMAKE_BUILD_TYPE=Release -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=.
          cmake --build tests/build --config release
          ./tests/build/test_vulkan

  test-prebuilt-macos:
    if: ${{ contains(github.event.inputs.extra_tests, 'prebuilt-mac') }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup tmate session
        if: ${{ contains(github.event.inputs.extra_tests, 'tmate-before') }}
        uses: mxschmitt/action-tmate@v3.24
        with:
          limit-access-to-actor: true
      - uses: ./
        id: composite
        with:
          version: ${{ fromJSON(github.event.inputs.versions)[0] }}
          cache: false
      - name: Setup tmate session
        if: steps.composite.outcome != 'success' || contains(github.event.inputs.extra_tests, 'tmate-after')
        uses: mxschmitt/action-tmate@v3.24
        with:
          limit-access-to-actor: true
      - name: Smoke test Vulkan SDK
        shell: bash
        run: |
          echo VULKAN_SDK=$VULKAN_SDK
          echo VULKAN_SDK_VERSION=$VULKAN_SDK_VERSION
          echo C_INCLUDE_PATH=$C_INCLUDE_PATH
          echo LIBRARY_PATH=$LIBRARY_PATH
          test -n "$C_INCLUDE_PATH"
          test -n "$LIBRARY_PATH"
          glslangValidator --version
          spirv-cfg --version
          spirv-cross --help 2>&1 | head -1
          glslc --version
          du -hsc $VULKAN_SDK/*
          find $VULKAN_SDK -size +50M | xargs ls -lrth
      - name: Test compiling against Vulkan SDK Install
        shell: bash
        run: |
          echo "Vulkan SDK Version=='$VULKAN_SDK_VERSION'"
          echo "VULKAN_SDK=='$VULKAN_SDK'"
          test -n "$VULKAN_SDK_VERSION"
          # C_INCLUDE_PATH/LIBRARY_PATH and the platform runtime library path
          # are exported by the action; compile/link/run with a bare `cc` and
          # no extra env vars to verify the SDK is found
          mkdir -p tests/build
          cc -o tests/build/test_vulkan_env tests/test_vulkan.c -lvulkan
          ./tests/build/test_vulkan_env
          cmake -B tests/build -S tests -DCMAKE_BUILD_TYPE=Release -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=.
          cmake --build tests/build --config release
          ./tests/build/test_vulkan
      - name: Setup tmate session on failure
        if: failure()
        uses: mxschmitt/action-tmate@v3.24
        with:
          limit-access-to-actor: true
